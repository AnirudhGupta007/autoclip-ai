# Production nginx: HTTPS on 443, HTTP only for ACME challenges + redirect.
# Mounted over default.conf by docker-compose.prod.yml; local dev keeps nginx.conf.
# Certs are issued/renewed on the host by acme.sh into /opt/autoclip/certs.

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (acme.sh --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2G;  # large video uploads

    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events: no buffering, long-lived connection
    location /api/chat/stream/ {
        proxy_pass http://backend:8000/api/chat/stream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    location /outputs/ {
        proxy_pass http://backend:8000/outputs/;
    }

    # index.html must revalidate so new deploys show up without a hard refresh
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
