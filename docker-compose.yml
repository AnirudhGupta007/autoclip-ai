services:
  postgres:
    # pgvector/pgvector ships Postgres 16 + the `vector` extension preinstalled.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoclip
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoclip_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip -d autoclip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ─── Storage / queues ────────────────────────────────
      DATABASE_URL: postgresql+psycopg2://autoclip:${POSTGRES_PASSWORD:-autoclip_dev_password}@postgres:5432/autoclip
      LANGGRAPH_PG_URL: postgresql://autoclip:${POSTGRES_PASSWORD:-autoclip_dev_password}@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379/0
      USE_PGVECTOR: "1"

      # ─── API keys (host .env) ────────────────────────────
      # OpenRouter is the only LLM provider — see backend/src/autoclip/llm/openrouter.py
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}

      # ─── Models (all via OpenRouter) ─────────────────────
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_MODEL_RERANK: ${OPENROUTER_MODEL_RERANK:-}
      OPENROUTER_MODEL_LITE: ${OPENROUTER_MODEL_LITE:-qwen/qwen3-30b-a3b-instruct-2507}
      OPENROUTER_MODEL_VISION: ${OPENROUTER_MODEL_VISION:-google/gemini-2.5-flash-lite}
      OPENROUTER_MODEL_AUDIO: ${OPENROUTER_MODEL_AUDIO:-google/gemini-2.5-flash-lite}

      # ─── Embeddings (OpenRouter /embeddings, open-source BGE-M3) ──
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-baai/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}

      # ─── Pipeline tuning ─────────────────────────────────
      CHUNK_LENGTH_SECONDS: ${CHUNK_LENGTH_SECONDS:-120}
      CHUNK_OVERLAP_SECONDS: ${CHUNK_OVERLAP_SECONDS:-10}
      CHUNK_MAX: ${CHUNK_MAX:-60}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-300}
      SCENE_THRESHOLD: ${SCENE_THRESHOLD:-0.3}
      TRANSCRIBE_SEGMENT_SECONDS: ${TRANSCRIBE_SEGMENT_SECONDS:-180}
      TRANSCRIBE_PARALLELISM: ${TRANSCRIBE_PARALLELISM:-4}
      TRANSCRIBE_MAX_TOKENS: ${TRANSCRIBE_MAX_TOKENS:-8192}
      TRANSCRIBE_ATTEMPTS: ${TRANSCRIBE_ATTEMPTS:-3}
      TRANSCRIBE_MIN_COVERAGE: ${TRANSCRIBE_MIN_COVERAGE:-0.8}
      TRANSCRIBE_TIMESTAMP_FORMAT: ${TRANSCRIBE_TIMESTAMP_FORMAT:-mmss}
      VISION_INPUT_MODE: ${VISION_INPUT_MODE:-frames}
      VISION_MAX_FRAMES: ${VISION_MAX_FRAMES:-24}
      VISION_FRAME_WIDTH: ${VISION_FRAME_WIDTH:-768}
      VISION_VIDEO_HEIGHT: ${VISION_VIDEO_HEIGHT:-360}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-4096}
      CHUNK_ANALYZE_ATTEMPTS: ${CHUNK_ANALYZE_ATTEMPTS:-2}
      VISION_FFMPEG_CONCURRENCY: ${VISION_FFMPEG_CONCURRENCY:-2}
      VISION_STATIC_CHECK: ${VISION_STATIC_CHECK:-1}
      VISION_STATIC_FRAMES: ${VISION_STATIC_FRAMES:-4}
      VISION_STATIC_DIFF: ${VISION_STATIC_DIFF:-12}
      FUSION_DEDUPE_THRESHOLD: ${FUSION_DEDUPE_THRESHOLD:-0.92}
      FUSION_DEDUPE_WINDOW_SECONDS: ${FUSION_DEDUPE_WINDOW_SECONDS:-180}

      # ─── Tracing ─────────────────────────────────────────
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-Autoclip}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}

      # ─── App ─────────────────────────────────────────────
      # Explicit list — cookies are credentials, so never "*". The SPA is
      # served same-origin by nginx; only add other origins you actually use.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs

      # ─── Public-demo quota (services/rate_limit.py) ──────
      DAILY_QUERY_LIMIT: ${DAILY_QUERY_LIMIT:-2}
      DAILY_GLOBAL_QUERY_LIMIT: ${DAILY_GLOBAL_QUERY_LIMIT:-0}
      DAILY_ANALYSIS_MINUTES_LIMIT: ${DAILY_ANALYSIS_MINUTES_LIMIT:-240}
      DAILY_ANALYSIS_LIMIT: ${DAILY_ANALYSIS_LIMIT:-2}
      ANALYSIS_MAX_CONCURRENCY: ${ANALYSIS_MAX_CONCURRENCY:-1}
      IP_DAILY_QUERY_LIMIT: ${IP_DAILY_QUERY_LIMIT:-20}

      # ─── Auth (backend/src/autoclip/auth/settings.py) ────
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DEMO_ENABLED: ${DEMO_ENABLED:-1}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@autoclip.local}
      DEMO_DAILY_QUERY_LIMIT: ${DEMO_DAILY_QUERY_LIMIT:-10}
      MAX_VIDEOS_PER_USER: ${MAX_VIDEOS_PER_USER:-3}
      MAX_VIDEO_MINUTES_DEMO: ${MAX_VIDEO_MINUTES_DEMO:-60}
      VIDEO_MINUTES_CAP_ADMINS: ${VIDEO_MINUTES_CAP_ADMINS:-1}

      # ─── Storage + retention (services/storage.py) ───────
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-1536}
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-5}
      SOURCE_RETENTION_DAYS: ${SOURCE_RETENTION_DAYS:-7}
      CLIP_RETENTION_DAYS: ${CLIP_RETENTION_DAYS:-30}
      INACTIVE_ACCOUNT_DAYS: ${INACTIVE_ACCOUNT_DAYS:-60}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-1}
      CLEANUP_HOUR_UTC: ${CLEANUP_HOUR_UTC:-3}

      # ─── Readiness (/api/health/ready, services/health.py) ─
      READY_MIN_FREE_DISK_GB: ${READY_MIN_FREE_DISK_GB:-1}
      READY_MIN_OPENROUTER_USD: ${READY_MIN_OPENROUTER_USD:-0}
      # nginx serves media from its internal /_protected/ location after the
      # backend's ownership check (routers/files.py)
      FILES_ACCEL_REDIRECT: "1"
    ports:
      # Loopback only: public traffic must come through nginx, which sets the
      # X-Real-IP the per-visitor quota trusts. An exposed :8000 could spoof it.
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      # Read-only media for nginx's `internal` /_protected/ locations — only
      # reachable through an X-Accel-Redirect from an authorised API call.
      - uploads:/srv/uploads:ro
      - outputs:/srv/outputs:ro

volumes:
  pgdata:
  redisdata:
  uploads:
  outputs:
