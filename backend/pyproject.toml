[project]
name = "autoclip"
version = "2.0.0"
description = "Conversational AI video clipping with multimodal LangGraph pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.6.0",
    "httpx>=0.25.0",
    "opencv-python-headless>=4.8.0,<5.0.0",  # 5.x moved/dropped cv2.CascadeClassifier at import time
    "ffmpeg-python>=0.2.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",  # langgraph-checkpoint-postgres needs psycopg v3, not the psycopg2 below
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "deepagents>=0.1.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclip"]

